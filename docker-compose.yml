services:
  helpdesk:
    build: .
    image: ai-helpdesk:latest
    container_name: ai-helpdesk
    restart: unless-stopped

    # Host networking is strongly recommended for SIP.  RTP negotiates ports in
    # the SDP body, which Docker's NAT does not rewrite, so bridged networking
    # gives you one-way audio unless you pin and publish the whole RTP range.
    network_mode: host

    environment:
      HELPDESK_CONFIG: /app/config/config.yaml

      # --- SIP account (required) -------------------------------------
      HELPDESK_SIP_USERNAME: "${SIP_USERNAME}"
      HELPDESK_SIP_PASSWORD: "${SIP_PASSWORD}"
      HELPDESK_SIP_SERVER_HOST: "${SIP_SERVER_HOST}"
      HELPDESK_SIP_DOMAIN: "${SIP_DOMAIN:-${SIP_SERVER_HOST}}"
      HELPDESK_SIP_SERVER_PORT: "${SIP_SERVER_PORT:-5060}"
      # Set this if auto-detection picks the wrong interface.
      HELPDESK_SIP_ADVERTISE_HOST: "${SIP_ADVERTISE_HOST:-}"

      # --- where unhandled calls go (required) ------------------------
      HELPDESK_DIALOG_TRANSFER_NUMBER: "${TRANSFER_NUMBER}"

      # --- models ------------------------------------------------------
      HELPDESK_LLM_BASE_URL: "${OLLAMA_URL:-http://127.0.0.1:11434}"
      HELPDESK_LLM_MODEL: "${LLM_MODEL:-qwen2.5:7b-instruct-q4_K_M}"
      HELPDESK_TTS_BACKEND: "${TTS_BACKEND:-piper}"

      NVIDIA_VISIBLE_DEVICES: "${GPU_UUID:-all}"

    volumes:
      - ./config:/app/config:ro
      - ./knowledge:/app/knowledge:ro
      - ./voices:/models/piper:ro
      - helpdesk-models:/models
      - ./transcripts:/app/transcripts

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Pin the L4 by UUID if other GPUs are present:
              # device_ids: ["GPU-xxxxxxxx-...."]
              count: 1
              capabilities: [gpu]

    # faster-whisper and the TTS backends use shared memory for dataloading.
    shm_size: "1gb"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  helpdesk-models:
