services:
  helpdesk:
    build:
      context: .
      args:
        # lite = Piper only (default, builds in minutes).
        # quality = adds Chatterbox on the GPU.
        TTS_PROFILE: "${TTS_PROFILE:-lite}"
    image: ai-helpdesk:latest
    container_name: ai-helpdesk
    # Not unless-stopped: a configuration error would otherwise restart forever,
    # reloading models each time. Five attempts covers a transient failure and
    # then leaves the container stopped with the error visible in the log.
    restart: on-failure:5

    # Host networking is strongly recommended for SIP.  RTP negotiates ports in
    # the SDP body, which Docker's NAT does not rewrite, so bridged networking
    # gives you one-way audio unless you pin and publish the whole RTP range.
    network_mode: host

    environment:
      HELPDESK_CONFIG: /app/config/config.yaml

      # --- SIP account (required) -------------------------------------
      HELPDESK_SIP_USERNAME: "${SIP_USERNAME}"
      HELPDESK_SIP_PASSWORD: "${SIP_PASSWORD}"
      HELPDESK_SIP_SERVER_HOST: "${SIP_SERVER_HOST}"
      HELPDESK_SIP_DOMAIN: "${SIP_DOMAIN:-${SIP_SERVER_HOST}}"
      HELPDESK_SIP_SERVER_PORT: "${SIP_SERVER_PORT:-5060}"
      # Set this if auto-detection picks the wrong interface.
      HELPDESK_SIP_ADVERTISE_HOST: "${SIP_ADVERTISE_HOST:-}"

      # --- where unhandled calls go (required) ------------------------
      HELPDESK_DIALOG_TRANSFER_NUMBER: "${TRANSFER_NUMBER}"

      # --- models ------------------------------------------------------
      HELPDESK_LLM_BASE_URL: "${OLLAMA_URL:-http://127.0.0.1:11434}"
      HELPDESK_LLM_MODEL: "${LLM_MODEL:-qwen2.5:7b-instruct-q4_K_M}"
      HELPDESK_TTS_BACKEND: "${TTS_BACKEND:-piper}"

      # How the agent hands calls over. auto = try SIP REFER, fall back to the
      # PBX feature code (needed when a managed PBX has allow_transfer=no).
      HELPDESK_DIALOG_TRANSFER_METHOD: "${TRANSFER_METHOD:-auto}"
      HELPDESK_DIALOG_TRANSFER_DTMF_FEATURE_CODE: "${TRANSFER_FEATURE_CODE:-##}"

      # Which GPU this container may use. Index or UUID; see nvidia-smi -L.
      NVIDIA_VISIBLE_DEVICES: "${GPU_ID:-0}"

    volumes:
      - ./config:/app/config:ro
      - ./knowledge:/app/knowledge:ro
      - ./voices:/models/piper:ro
      - helpdesk-models:/models
      - ./transcripts:/app/transcripts

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # One specific GPU, by index or UUID (GPU_ID in .env). Pinning
              # matters on a multi-GPU host: without it the container may land on
              # a card that is already full and fail to allocate.
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]

    # faster-whisper and the TTS backends use shared memory for dataloading.
    shm_size: "2gb"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  helpdesk-models:
