# Voxtral TTS (mistralai/Voxtral-4B-TTS-2603) as a voice server.
#
# Why this instead of Qwen3-TTS in the agent image: vLLM-Omni serves it on the
# OpenAI-compatible /v1/audio/speech route with stream=true and 24 kHz PCM,
# which is exactly the protocol the agent's `openai` backend already speaks.
# So there is no new TTS code in the agent at all, and the voice runs in its
# own process where a slow model cannot stall the call loop.
#
# Switch it on with a line in .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.voxtral.yml
#
# Combine with the local Asterisk by listing all three, colon-separated.
#
# Bring the stack DOWN first when switching to this voice:
#
#   docker compose down && docker compose up -d --build
#
# depends_on only orders starts. On a plain `up -d` this service loads its
# model while the previous agent container is still holding the GPU -- and that
# container holds whatever local TTS it was configured with, several gigabytes
# of it. Both fit on a 23 GB card only by luck; `down` first removes the
# question. Switching away from a local voice backend is also what frees that
# memory in the first place, since the agent then only speaks HTTP.
#
# KNOWN TO FAIL ON A CPU WITHOUT AVX (2026-10-02, vllm-omni v0.30.0):
#
#   FATAL: UCX library was compiled with avx but CPU does not support it.
#   !!!!!!! Segfault encountered !!!!!!!  ... in ucs_init
#
# UCX checks at load time that the CPU has the instructions it was built with,
# and kills the process when it does not -- during dlopen, so it cannot be
# caught and no UCX_* variable overrides it. It is reached through an import
# chain, not through anything configured here, so there is nothing to turn off.
# The fix is upstream: rebuild the bundled UCX with --without-avx
# (ai-dynamo/nixl PR 2122), not yet in a release.
#
# Virtual machines are the usual reason: a CPU model such as qemu64 or
# x86-64-v2 hides AVX from the guest. Check before pulling 8.7 GB:
#
#   grep -o 'avx[^ ]*' /proc/cpuinfo | sort -u     # empty output means no AVX
#
# No AVX and you need a natural German voice: use chatterbox instead
# (TTS_PROFILE=quality, ~3 GB, torch on the GPU, no UCX anywhere).
#
# Otherwise NOT TESTED HERE -- this environment has no GPU and no docker
# daemon. The route, the request fields and the 24 kHz PCM follow the vLLM-Omni
# speech API docs. Watch the first start:  docker compose logs -f voxtral

services:
  voxtral:
    # vllm-omni, NOT vllm-openai: --omni comes from the vllm-omni package and
    # the plain serving image does not carry it, so there the flag is simply an
    # unrecognised argument. Pinned rather than :latest -- a voice server that
    # upgrades itself underneath a telephone system is not a feature. vllm-omni
    # and vllm must share a major.minor, which this image already does.
    image: "${VOXTRAL_IMAGE:-vllm/vllm-omni:v0.30.0}"
    container_name: voxtral-tts
    # No restart loop: the failure mode that actually happens here is a CPU
    # that cannot run the image, and retrying that five times only buries the
    # one line of the log that says why.
    restart: "no"

    # Host networking so 127.0.0.1:8092 reaches it from the agent, same as the
    # rest of the stack.
    network_mode: host

    # The entrypoint is set explicitly so the command does not depend on what
    # the image happens to default to, and the model is positional, the way the
    # vLLM-Omni docs give it. --omni is what enables the speech routes. The port
    # is deliberately not 8000: a production vLLM usually already sits there.
    entrypoint: ["vllm"]
    command: >
      serve ${VOXTRAL_MODEL:-mistralai/Voxtral-4B-TTS-2603}
      --omni
      --port ${VOXTRAL_PORT:-8092}
      --gpu-memory-utilization ${VOXTRAL_GPU_FRACTION:-0.45}

    environment:
      HF_HOME: /models/hf
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
      # Only this GPU, so it cannot land on a card another workload fills.
      NVIDIA_VISIBLE_DEVICES: "${GPU_ID:-0}"

    volumes:
      - helpdesk-models:/models

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]

    shm_size: "4gb"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  helpdesk:
    # Pinned here rather than left to config.yaml: starting this overlay means
    # using this voice, and a leftover tts.backend in the file would otherwise
    # quietly win -- which is exactly how an afternoon went to piper.
    environment:
      HELPDESK_TTS_BACKEND: "openai"
      HELPDESK_TTS_OPENAI_BASE_URL: "http://127.0.0.1:${VOXTRAL_PORT:-8092}/v1"
      HELPDESK_TTS_OPENAI_MODEL: "${VOXTRAL_MODEL:-mistralai/Voxtral-4B-TTS-2603}"
      HELPDESK_TTS_OPENAI_RESPONSE_FORMAT: "pcm"
      HELPDESK_TTS_OPENAI_SAMPLE_RATE: "24000"
      HELPDESK_TTS_OPENAI_LANGUAGE: "${VOXTRAL_LANGUAGE:-German}"
      HELPDESK_TTS_OPENAI_VOICE: "${VOXTRAL_VOICE:-casual_female}"
      HELPDESK_TTS_OPENAI_STREAM: "true"
    depends_on:
      - voxtral

volumes:
  helpdesk-models:
